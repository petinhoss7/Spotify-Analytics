version: 2

models:
  - name: int_artists_genre_attribution
    description: >
      Final genre / sous-genre attribution per artist, one row per artist
      with at least one genre-classified tag. The result is a *combination*
      of four attributes: (primary_genre, primary_style) plus
      (secondary_genre, secondary_style), each style belonging to the genre
      it is paired with. The secondary pair is filled whenever the artist
      has a second scored genre.

      Weighted sum, explainable: row_weight = method_weight x
      ln(1 + tag_count), with method_weight verified/exact/alias 1.0,
      fuzzy 0.9, llm 0.8; genre_score = sum(row_weight)
      x (1 + 0.5 x (distinct_sources - 1)). Cross-source agreement
      outranks tag volume; scores are deterministic (ties broken by
      source count then name).

      The secondary pair is filled from the runner-up genre, but only when it
      is real evidence: it must rest on at least
      attribution_min_secondary_tags distinct tags, or still weigh at least
      attribution_min_secondary_score_ratio of the primary score. A genre
      resting on a single stray tag is not a genre. Its strength is always
      reported through secondary_score_ratio, secondary_nb_tags and
      secondary_sources_count. Styles are ranked within each genre, so the
      primary style is the best style of the primary genre and the secondary
      style the best style of the secondary genre.

      Confidence: primary_share (score share of the artist) and
      combined_confidence = 0.6 x primary_share + 0.4 x (sources / 3).
      is_ambiguous flags near-ties (runner-up ratio >= 0.75), in which case
      primary and secondary should be read as an unordered pair.

    columns:

      - name: artist_id
        description: Unique identifier of the artist.
        tests:
          - not_null
          - unique

      - name: spotify_artist_name
        description: Artist name as provided by Spotify.

      - name: primary_genre
        description: >
          The artist's primary Discogs genre - highest scoring genre.
        tests:
          - not_null

      - name: primary_genre_score
        description: Weighted score of the primary genre (source-bonus applied).

      - name: primary_share
        description: >
          Primary genre score as a share of the artist's total genre
          score (0 to 1).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: nb_supporting_sources
        description: Number of distinct sources tagging the primary genre (1 to 3).

      - name: nb_genre_tags
        description: Distinct raw tags supporting the primary genre.

      - name: nb_distinct_genres
        description: Number of distinct genres classified for this artist.

      - name: secondary_genre
        description: >
          Runner-up genre, kept when it is real evidence: at least
          {{ var('attribution_min_secondary_tags', 2) }} distinct tags back
          it, or it still weighs at least
          {{ var('attribution_min_secondary_score_ratio', 0.10) }} of the
          primary score. A genre resting on a single stray tag is not a
          genre. Null when the artist has a single scored genre, or when the
          runner-up fails the rule. Never equal to primary_genre.

      - name: secondary_genre_score
        description: Weighted score of the secondary genre.

      - name: secondary_score_ratio
        description: >
          Runner-up genre score / primary genre score (0 to 1), null when the
          artist has a single genre. Reported for candidates that fail the
          rule too, so the strength is never hidden.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: secondary_sources_count
        description: Number of distinct sources tagging the runner-up genre.

      - name: secondary_nb_tags
        description: >
          Distinct raw tags backing the runner-up genre - the evidence the
          inclusion rule is based on.

      - name: primary_style
        description: >
          Highest scoring style among the primary genre's rows for this
          artist, so it always belongs to primary_genre. Null when the
          artist has no styled tag under that genre.

      - name: primary_style_score
        description: Weighted score of the primary style.

      - name: secondary_style
        description: >
          Highest scoring style among the secondary genre's rows, so it
          always belongs to secondary_genre. Null when the artist has no
          secondary genre, or no styled tag under it.

      - name: secondary_style_score
        description: Weighted score of the secondary style.

      - name: combined_confidence
        description: >
          0.6 x primary_share + 0.4 x (nb_supporting_sources / 3), 0 to 1.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: is_ambiguous
        description: >
          True when the runner-up genre ratio >= 0.75 - the top-2 genres
          are nearly tied and the primary pick is a judgment call, so
          primary and secondary are best read as an unordered pair.
        tests:
          - not_null
