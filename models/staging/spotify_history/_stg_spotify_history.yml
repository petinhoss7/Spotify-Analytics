version: 2

models:
  - name: stg_spotify_history
    description: Flattened and typed Spotify streaming data from raw VARIANT records
    columns:
      - name: stream_id
        description: Surrogate key from track_uri + timestamp + ms_played
        tests:
          - not_null

      - name: streamed_at
        description: Timestamp of when the stream occurred (normalized to UTC)
        tests:
          - not_null

      - name: track_name
        description: Name of the track played

      - name: artist_name
        description: Name of the artist

      - name: album_name
        description: Name of the album

      - name: spotify_track_uri
        description: Spotify URI for the track

      - name: ms_played
        description: Milliseconds played
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0

      - name: minutes_played
        description: Minutes played (ms_played / 60000)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: platform
        description: Device/OS platform used for playback

      - name: conn_country
        description: Two-letter country code of connection
        tests:
          - not_null

      - name: reason_start
        description: Why playback started (e.g. trackdone, clickrow, fwdbtn)
        tests:
          - accepted_values:
              arguments: 
                values: ['trackdone', 'clickrow', 'fwdbtn', 'backbtn', 'playbtn', 'appload', 'remote', 'trackerror', 'switched-to-audio', 'unknown']
              config:
                severity: warn

      - name: reason_end
        description: Why playback ended
        tests:
          - accepted_values:
              arguments:
                values: ['trackdone', 'fwdbtn', 'backbtn', 'endplay', 'remote', 'logout', 'unexpected-exit', 'unexpected-exit-while-paused', 'trackerror', 'clickrow', 'switched-to-video', 'unknown']
              config:
                severity: warn

      - name: shuffle
        description: Whether shuffle mode was on

      - name: skipped
        description: Whether the track was skipped

      - name: offline
        description: Whether played in offline mode

      - name: offline_timestamp
        description: Timestamp of offline playback cache

      - name: incognito_mode
        description: Whether played in private/incognito mode

      - name: ip_addr_hash
        description: MD5 hash of the listener IP address (raw IP is dropped at staging to avoid storing PII)

      - name: episode_name
        description: Podcast episode name (null if music)

      - name: episode_show_name
        description: Podcast show name (null if music)

      - name: spotify_episode_uri
        description: Spotify URI for podcast episode

      - name: audiobook_title
        description: Audiobook title (null if music/podcast)

      - name: audiobook_chapter_title
        description: Audiobook chapter title

      - name: audiobook_uri
        description: Spotify URI for audiobook

      - name: audiobook_chapter_uri
        description: Spotify URI for audiobook chapter

      - name: is_podcast
        description: True if the record is a podcast stream

      - name: is_audiobook
        description: True if the record is an audiobook stream

      - name: source_file_name
        description: Original file name from raw data load
        tests:
          - not_null

      - name: loaded_at
        description: Timestamp when data was loaded into raw table
        tests:
          - not_null

