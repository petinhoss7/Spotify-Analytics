
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'spotify_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'spotify_analytics'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  spotify_analytics:
    # Applies to all files under models/staging/
    staging:
      +materialized: view
    # Heavy aggregations: materialize as tables instead of recomputing on every query
    intermediate:
      +materialized: table
    # Serving layer: analysis-ready facts
    marts:
      +materialized: table

data_tests:
  +store_failures: true
  +schema: test_failures

# Attribution tunables (int_artists_genre_attribution)
vars:
  attribution_min_secondary_score_ratio: 0.5
  attribution_min_secondary_sources: 2
  attribution_min_secondary_style_ratio: 0.5
  attribution_ambiguity_ratio: 0.75

# Seeds: closed-list reference data and the tag classification map
# produced offline by scripts/classifier/classify_tags.py
seeds:
  spotify_analytics:
    discogs_genre_styles:
      +column_types:
        discogs_genre: varchar
        discogs_style: varchar
    tag_genre_map:
      # fast: false -> agate-based batched inserts; DuckDB COPY chokes on
      # RFC-4180 escaped quotes inside tag values
      +fast: false
      +column_types:
        raw_tag: varchar
        is_genre_tag: boolean
        discogs_genre: varchar
        discogs_style: varchar
        match_method: varchar
        match_score: integer
    tag_aliases:
      # consumed by the classifier script only, not materialized in the warehouse
      +enabled: false
    tags_to_verify:
      # hand-verification list produced by scripts/classifier/tags_to_verify.py
      # (a working document, not warehouse reference data)
      +enabled: false
