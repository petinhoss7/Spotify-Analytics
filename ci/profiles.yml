# Profile used by CI (and local dry-runs of the CI setup):
#   python ci/seed_fixture.py
#   dbt build --profiles-dir ci --target ci
#
# The database is generated by ci/seed_fixture.py and is git-ignored.
spotify_analytics:
  target: ci

  outputs:
    ci:
      type: duckdb
      path: "ci/fixture.duckdb"
      threads: 4