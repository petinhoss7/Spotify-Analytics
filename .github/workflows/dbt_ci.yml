name: dbt CI

on:
  push:
    branches: [main, master, genre-classification-system]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dbt build (synthetic fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # ci/profiles.yml -> DuckDB file generated by ci/seed_fixture.py
      DBT_PROFILES_DIR: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Build synthetic fixture database
        run: python ci/seed_fixture.py

      - name: dbt build (models + seeds + tests)
        run: dbt build --target ci

      - name: Upload dbt artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            target/
            logs/
          if-no-files-found: ignore